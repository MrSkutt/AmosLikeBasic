name: Release

# Push a version tag to make a release with downloads for Mac and Windows:
#   git tag v0.9.0 && git push origin v0.9.0
# Or run it by hand from the Actions tab to just build the downloads (no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the test build, e.g. 0.9.0'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest   # the Mac app needs codesign; the Windows version builds here too
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test Tests/AmosLikeBasic.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build the downloads
        run: python3 Tools/build_release.py "${{ github.event.inputs.version || github.ref_name }}"

      - name: Keep the downloads (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AmosLikeBasic-${{ github.event.inputs.version }}
          path: Export/Release/*.zip

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Export/Release/*.zip \
            --title "AMOS Like Basic ${{ github.ref_name }}" \
            --generate-notes
