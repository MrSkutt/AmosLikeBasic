name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest   # Apple Silicon, matches the app's osx-arm64 build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Tests/AmosLikeBasic.Tests.csproj -c Release

      - name: Test
        run: dotnet test Tests/AmosLikeBasic.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
