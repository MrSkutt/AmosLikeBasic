name: Tests

on:
  push:            # every branch, so that work on a branch is tested on Mac and Windows too
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false      # a failure on one platform should not hide the result on the other
      matrix:
        os: [macos-latest, windows-latest]   # Apple Silicon (osx-arm64) and Windows x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Tests/AmosLikeBasic.Tests.csproj -c Release

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/AmosLikeBasic.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory TestResults 2>&1 | tee test-output.txt

      # The failed tests as annotations, which show on the run's page (and can be read without the full log)
      - name: Report failed tests
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(path).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      msg = r.findtext(".//t:Message", default="", namespaces=ns)
                      msg = " ".join(msg.split())[:900].replace("%", "%25")
                      print(f"::error title={r.get('testName')[:200]}::{msg}")
          # No failed test in the report (the run crashed or was stopped): the end of the output instead
          import os
          if not any(r.get("outcome") == "Failed"
                     for p in glob.glob("TestResults/**/*.trx", recursive=True)
                     for r in ET.parse(p).getroot().iterfind(".//t:UnitTestResult", ns)) and os.path.exists("test-output.txt"):
              tail = open("test-output.txt", encoding="utf-8", errors="replace").read().splitlines()[-60:]
              text = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in tail)
              print(f"::error title=The end of the test output::{text}")
